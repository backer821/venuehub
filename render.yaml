services:
  - type: web
    name: venuehub
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      # Do NOT set NODE_ENV here: `next build`/`next start` set it internally
      # at the right time. Setting it as a service-wide env var makes Render
      # apply it during `npm ci` too, which makes npm skip devDependencies
      # (tailwindcss, typescript, etc.) — breaking the build. `--include=dev`
      # below is a second safety net against the same class of problem.
      - key: DATABASE_URL
        fromDatabase:
          name: venuehub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Demo/test only: lets the "Seed Demo Data" button on /login work on the
      # deployed instance. Set to "false" (or remove) once you're done testing —
      # it wipes and reseeds all data on every call.
      - key: ALLOW_SEED
        value: "true"

databases:
  - name: venuehub-db
    plan: free
    databaseName: venuehub
    user: venuehub
